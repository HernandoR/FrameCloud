name: Slow Tests - Cross Platform

on:
  push:
    branches:
      - main
      - "release/**"
      - "release-*"
    tags:
      - "v*"
      - "release*"
    paths:
      - "src/**"
      - "tests/test_benchmark.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Justfile"
      - ".github/workflows/test-slow-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-slow-cross-platform:
    name: Benchmark Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.11"
          enable-cache: "auto"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: uv sync --dev

      - name: Run benchmark tests
        run: just benchmark

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            reports
          retention-days: 30
          if-no-files-found: warn

      - name: Generate benchmark summary
        if: always()
        run: |
          echo "## 📊 Benchmark Results (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmark artifacts have been uploaded and can be downloaded from the workflow run page." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Generated Charts" >> $GITHUB_STEP_SUMMARY
          if [ -d "reports/benchmarks" ]; then
            for svg in reports/benchmarks/*.svg; do
              if [ -f "$svg" ]; then
                basename "$svg"
                echo "- $(basename "$svg")" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
