# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  test-slow-ubuntu:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: "Setup environment"
          command: scripts/setup-env.sh
      - run:
          name: "Run benchmark tests"
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            just benchmark
      - store_artifacts:
          path: reports
          destination: benchmark-results

  test-slow-macos:
    macos:
      xcode: "26.3.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: "Setup environment"
          command: scripts/setup-env.sh
      - run:
          name: "Run benchmark tests"
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            just benchmark
      - store_artifacts:
          path: reports
          destination: benchmark-results-macos

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  slow-tests-workflow:
    jobs:
      - test-slow-ubuntu
      - test-slow-macos
