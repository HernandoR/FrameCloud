# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference
version: 2.1

# orbs:
#   node: circleci/node@4.7

executors:
  docker: # Docker using the Base Convenience Image
    docker:
      - image: cimg/base:stable
  linux: # a Linux VM running Ubuntu 20.04
    machine:
      image: ubuntu-2204:2025.09.1
  macos: # macos executor running Xcode
    macos:
      xcode: 26.3.0

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  test-slow:
    parameters:
      os:
        type: executor
      python-version:
        type: string
      resource_class:
        type: string
    executor: << parameters.os >>
    resource_class: << parameters.resource_class >>
    steps:
      - run:
          name: "Print environment info"
          command: |
            echo "Running on OS: << parameters.os >>"
            echo "Using Python version: << parameters.python-version >>"
            echo "Resource class: << parameters.resource_class >>"
            echo "pipeline_event.name: << pipeline.event.name >> "
            echo "pipeline_event.action: << pipeline.event.action >> "

      - checkout
      - run:
          name: "Setup environment"
          command: scripts/setup-env.sh << parameters.python-version >>
      - run:
          name: "Run benchmark tests"
          command: |
            export PATH="$HOME/.cargo/bin:$PATH"
            just benchmark
      - store_artifacts:
          path: reports
          destination: "benchmark-reports-<< parameters.os >>-py<< parameters.python-version >>-<< parameters.resource_class >>"

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  slow-tests-workflow:
    when: pipeline.event.action == "labeled"

    jobs:
      - test-slow:
          # only if the pipeline.event.name is "api"
          matrix:
            parameters:
              os: [linux]
              python-version: ["3.10", "3.11", "3.12"]
              resource_class: ["large"]
